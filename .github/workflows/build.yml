name: Build Android 4.4 Non-GKI Kernel with SukiSU Ultra and KPM Patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: ./out

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          repository: jhe520/android_kernel_xiaomi_msm8998
          ref: lineage-18.1
          fetch-depth: 0

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven \
            libssl-dev pwgen libswitch-perl policycoreutils minicom \
            libxml-sax-base-perl libxml-simple-perl bc libx11-dev libgl1-mesa-dev \
            xsltproc unzip device-tree-compiler python3 libelf-dev binutils-aarch64-linux-gnu \
            repo wget

      - name: Install Python2 from Official Source
        run: |
          PYTHON2_VERSION=2.7.18
          wget https://www.python.org/ftp/python/$PYTHON2_VERSION/Python-$PYTHON2_VERSION.tgz
          tar -xvf Python-$PYTHON2_VERSION.tgz
          cd Python-$PYTHON2_VERSION
          ./configure --prefix=$HOME/.local
          make -j$(nproc)
          make install
          cd ..
          export PATH=$HOME/.local/bin:$PATH
          python2 --version

      - name: Clone Prebuilt GCC Toolchains from Google
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 prebuilts/gcc64
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 prebuilts/gcc32
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b prebuilts/clang

      - name: Set Toolchain Environment
        run: |
          ARCH=arm64
          OUT_DIR=./out
          CLANG_DIR=$PWD/prebuilts/clang
          CC=$CLANG_DIR/bin/clang
          CROSS_COMPILE=$PWD/prebuilts/gcc64/bin/aarch64-linux-android-4.9-
          CROSS_COMPILE_ARM32=$PWD/prebuilts/gcc32/bin/arm-linux-androideabi-4.9-
          CLANG_TRIPLE="aarch64-linux-gnu-"
          CC_ADDITION_FLAGS="AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 LLVM=1 LD=ld.lld"
          export PATH=$CLANG_DIR/bin:$PATH
          echo "Using toolchains:"
          $CC --version
          $CROSS_COMPILE --version
          $CROSS_COMPILE_ARM32 --version

      - name: Patch set_memory.h for <4.19 Kernel
        run: |
          mkdir -p include/linux
          echo "" | base64 --decode > include/linux/set_memory_patch.h
          sed -i '1i#include "set_memory_patch.h"' include/linux/set_memory.h

      - name: Update chiron_defconfig with required options
        run: |
          CONFIG_FILE="arch/arm64/configs/chiron_defconfig"
          declare -a OPTIONS=(
            "CONFIG_KALLSYMS=y"
            "CONFIG_KALLSYMS_ALL=y"
            "CONFIG_KPROBES=y"
            "CONFIG_HAVE_KPROBES=y"
            "CONFIG_KPROBE_EVENTS=y"
            "CONFIG_KSU=y"
            "CONFIG_KPM=y"
          )
          for opt in "${OPTIONS[@]}"; do
            if grep -q "^${opt%%=*}" $CONFIG_FILE; then
              sed -i "s|^${opt%%=*}.*|$opt|" $CONFIG_FILE
            else
              echo "$opt" >> $CONFIG_FILE
            fi
          done

      - name: Apply SukiSU Ultra Nongki Script
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

      - name: Build Kernel
        run: |
          THREAD=$(nproc --all)
          args="-j$THREAD O=$OUT_DIR ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE $CC_ADDITION_FLAGS"
          echo "[+]Args: $args"
          make chiron_defconfig $args
          make $args

      - name: Apply SukiSU KPM patch_linux
        run: |
          git clone https://github.com/SukiSU-Ultra/SukiSU_patch.git kpm
          cd kpm/kpm
          chmod +x patch_linux
          ./patch_linux "$GITHUB_WORKSPACE/$OUT_DIR"
          cd "$GITHUB_WORKSPACE"

      - name: Upload Patched Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-patched
          path: $OUT_DIR
